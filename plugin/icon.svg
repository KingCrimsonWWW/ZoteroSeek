<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ZoteroSeek">
  <!-- 一本书 + 一枚放大镜：文献库 + 检索。原创图形，缩放任意尺寸都可辨。 -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#1E3FA8"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE0FF"/>
    </linearGradient>
  </defs>
  <rect x="6" y="10" width="38" height="44" rx="5" fill="url(#cover)"/>
  <rect x="10" y="10" width="4" height="44" fill="#17307F"/>
  <g fill="#EAF1FF">
    <rect x="18" y="19" width="20" height="3" rx="1.5"/>
    <rect x="18" y="26" width="16" height="3" rx="1.5"/>
    <rect x="18" y="33" width="20" height="3" rx="1.5"/>
    <rect x="18" y="40" width="12" height="3" rx="1.5"/>
  </g>
  <circle cx="43" cy="39" r="11" fill="url(#lens)" stroke="#12266B" stroke-width="3"/>
  <circle cx="43" cy="39" r="6.5" fill="#BBD3FF" opacity="0.75"/>
  <rect x="50" y="47" width="9" height="5" rx="2.5" transform="rotate(45 50 47)" fill="#12266B"/>
</svg>
